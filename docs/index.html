<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DocScan</title>
  <meta name="description" content="Digitalize, una e edite PDFs no navegador." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="tool-only">
  <header class="top">
    <span class="mark"><span class="leaf"></span> DocScan</span>
  </header>

  <main class="work">
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="scan" type="button">Digitalizar</button>
      <button class="tab" data-tab="merge" type="button">Juntar PDFs</button>
      <button class="tab" data-tab="edit" type="button">Editar PDF</button>
    </div>

    <div id="panel-scan" class="panel on">
      <ol class="steps">
        <li>
          <h3>1. Enviar</h3>
          <div class="tools">
            <label class="chip">Arquivos<input id="scan-files" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple hidden /></label>
            <label class="chip">Câmera<input id="scan-cam" type="file" accept="image/*" capture="environment" hidden /></label>
            <label class="chk"><input type="checkbox" id="scan-ocr" /> OCR</label>
            <button class="chip ghost" id="scan-clear" type="button">Limpar</button>
          </div>
          <p id="scan-queue" class="note">Nenhum arquivo na fila.</p>
        </li>
        <li>
          <h3>2. Escolher recorte e realce</h3>
          <select id="scan-mode" class="sr-only" aria-hidden="true">
            <option value="auto" selected>auto</option>
            <option value="none">none</option>
          </select>
          <p class="lbl">Recorte</p>
          <div class="looks" id="mode-btns">
            <button type="button" class="look on" data-mode="auto">Recortar folha</button>
            <button type="button" class="look" data-mode="none">Foto inteira</button>
          </div>
          <select id="scan-look" class="sr-only" aria-hidden="true">
            <option value="color_paper" selected>color_paper</option>
            <option value="color_ink">color_ink</option>
            <option value="color_vivid">color_vivid</option>
            <option value="color_cool">color_cool</option>
            <option value="original">original</option>
            <option value="bw">bw</option>
            <option value="bw_soft">bw_soft</option>
          </select>
          <p class="lbl">Realce</p>
          <div class="looks" id="look-btns">
            <button type="button" class="look on" data-look="color_paper">Colorido papel branco</button>
            <button type="button" class="look" data-look="color_ink">Colorido tinta</button>
            <button type="button" class="look" data-look="color_vivid">Cores vivas</button>
            <button type="button" class="look" data-look="color_cool">Menos amarelo</button>
            <button type="button" class="look" data-look="original">Original</button>
            <button type="button" class="look" data-look="bw">P&B nítido</button>
            <button type="button" class="look" data-look="bw_soft">P&B suave</button>
          </div>
          <button class="chip green apply" id="scan-apply" type="button">Aplicar mudanças</button>
        </li>
        <li>
          <h3>3. Visualizar</h3>
          <div class="tools">
            <button class="chip" id="scan-print" type="button">Imprimir</button>
            <button class="chip green" id="scan-export" type="button">Exportar PDF</button>
          </div>
          <div id="scan-empty" class="void">O resultado aparece aqui depois de Aplicar.</div>
          <div id="scan-grid" class="grid"></div>
        </li>
      </ol>
    </div>

    <div id="panel-merge" class="panel">
      <div class="tools">
        <label class="chip">Adicionar PDFs<input id="merge-files" type="file" accept="application/pdf" multiple hidden /></label>
        <button class="chip ghost" id="merge-clear" type="button">Limpar</button>
        <button class="chip" id="merge-print" type="button">Imprimir</button>
        <button class="chip green" id="merge-export" type="button">Baixar unido</button>
      </div>
      <div id="merge-empty" class="void">Adicione PDFs para juntar.</div>
      <div id="merge-list" class="rows"></div>
    </div>

    <div id="panel-edit" class="panel">
      <div class="tools">
        <label class="chip">Abrir PDF<input id="edit-file" type="file" accept="application/pdf" hidden /></label>
        <button class="chip" id="edit-text" type="button">Inserir texto</button>
        <button class="chip" id="edit-print" type="button">Imprimir</button>
        <button class="chip ghost" id="edit-clear" type="button">Fechar</button>
        <button class="chip green" id="edit-export" type="button">Salvar PDF</button>
      </div>
      <div id="edit-empty" class="void">Abra um PDF para girar, reordenar ou apagar páginas.</div>
      <div id="edit-grid" class="grid"></div>
    </div>
  </main>

  <div id="modal" class="modal hide">
    <div class="sheet">
      <h3>Texto na página</h3>
      <label>Página <select id="text-page"></select></label>
      <label>Conteúdo <input id="text-content" maxlength="200" /></label>
      <div class="duo">
        <label>X % <input id="text-x" type="number" value="10" min="0" max="100" /></label>
        <label>Y % <input id="text-y" type="number" value="10" min="0" max="100" /></label>
      </div>
      <div class="actions">
        <button type="button" id="text-cancel" class="chip ghost">Cancelar</button>
        <button type="button" id="text-ok" class="chip green">Aplicar</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hide" role="status"></div>
  <div id="fx" class="fx-overlay hide">
    <div class="fx-card">
      <div class="spinner"></div>
      <p id="fx-msg">Processando…</p>
      <div class="bar"><i></i></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
